name: 3rdPartyBaseLibs
'on':
  push:
    branches:
    - main
    - dev
    tags:
    - v*.*.*
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
  schedule:
  - cron: 0 3 * * 1
jobs:
  release-from-artifacts:
    needs: orchestrator-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
    - name: Show downloaded files
      run: find artifacts -type f
    - name: Manifest creation
      run: |
        from dataclasses import dataclass, field, asdict
        from typing import Any, ClassVar
        from pathlib import Path
        import json

        @dataclass(frozen=True)
        class PackageVersion:
            name: str
            version: str

            def to_dict(self) -> dict[str, str]:
                return asdict(self)

            @classmethod
            def from_dict(cls, data: dict[str, str]) -> "PackageVersion":
                return cls(**data)

        @dataclass
        class ManifestVersionsEntry:
            variant: str
            entries: list[PackageVersion] = field(default_factory=list)

            def to_dict(self) -> dict[str, Any]:
                return {
                    "variant": self.variant,
                    "entries": [entry.to_dict() for entry in self.entries],
                }

            @classmethod
            def from_dict(cls, data: dict[str, Any]) -> "ManifestVersionsEntry":
                return cls(
                    variant=data["variant"],
                    entries=[PackageVersion.from_dict(entry) for entry in data["entries"]],
                )

        @dataclass
        class ReleaseManifest:
            project_name: str
            project_version: str
            variants: list[ManifestVersionsEntry] = field(default_factory=list)

            MANIFEST_VERSION: ClassVar[str] = "1.0"
            manifest_version: str = MANIFEST_VERSION

            CS_ORCHESTRATOR_MANIFEST_EXTENSION: ClassVar[str] = ".csOrchestratorManifest"
            CS_ORCHESTRATOR_MANIFEST_ROOT: ClassVar[str] = "csOrchestratorManifest"

            def to_dict(self) -> dict[str, Any]:
                return {
                    ReleaseManifest.CS_ORCHESTRATOR_MANIFEST_ROOT: {
                        "manifest_version": self.manifest_version,
                        "project_name": self.project_name,
                        "project_version": self.project_version,
                        "variants": [variant.to_dict() for variant in self.variants],
                    }
                }

            @classmethod
            def from_dict(cls, data: dict[str, Any]) -> "ReleaseManifest":
                in_data = data[ReleaseManifest.CS_ORCHESTRATOR_MANIFEST_ROOT]
                return cls(
                    manifest_version=in_data["manifest_version"],
                    project_name=in_data["project_name"],
                    project_version=in_data["project_version"],
                    variants=[ManifestVersionsEntry.from_dict(variant) for variant in in_data["variants"]],
                )

            def write_release_manifest(
                self,
                filename: Path,
            ) -> None:
                """Write a release manifest to a JSON file."""
                path = Path(filename)
                # TODO robustify and return possible errors
                with path.open("w", encoding="utf-8") as f:
                    json.dump(self.to_dict(), f, indent=2, sort_keys=True)

            @classmethod
            def load_release_manifest(
                cls,
                filename: Path,
            ) -> "ReleaseManifest":
                """Load a release manifest from a JSON file."""
                path = Path(filename)
                # TODO robustify and return possible errors
                with path.open("r", encoding="utf-8") as f:
                    return ReleaseManifest.from_dict(json.load(f))

        input_files_list = [
          '3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-x64-generic-gcc-default-ninjamulticonfig/3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-x64-generic-gcc-default-ninjamulticonfig.csOrchestratorManifest',
          '3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-x64-generic-clang-default-ninjamulticonfig/3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-x64-generic-clang-default-ninjamulticonfig.csOrchestratorManifest',
          '3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-gcc-default-ninja/3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-gcc-default-ninja.csOrchestratorManifest',
          '3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-clang-default-ninja/3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-clang-default-ninja.csOrchestratorManifest',
          '3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-x64-generic-gcc-default-ninjamulticonfig/3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-x64-generic-gcc-default-ninjamulticonfig.csOrchestratorManifest',
          '3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-x64-generic-clang-default-ninjamulticonfig/3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-x64-generic-clang-default-ninjamulticonfig.csOrchestratorManifest',
          '3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-gcc-default-ninja/3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-gcc-default-ninja.csOrchestratorManifest',
          '3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-clang-default-ninja/3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-clang-default-ninja.csOrchestratorManifest',
          '3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2022/3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2022.csOrchestratorManifest',
          '3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2026/3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2026.csOrchestratorManifest',
          '3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2022/3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2022.csOrchestratorManifest',
          '3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2026/3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2026.csOrchestratorManifest',
        ]

        input_names_list = [
          'csv1-linux-ubuntu22.04-x64-generic-gcc-default-ninjamulticonfig',
          'csv1-linux-ubuntu22.04-x64-generic-clang-default-ninjamulticonfig',
          'csv1-linux-ubuntu22.04-arm64-generic-gcc-default-ninja',
          'csv1-linux-ubuntu22.04-arm64-generic-clang-default-ninja',
          'csv1-linux-ubuntu24.04-x64-generic-gcc-default-ninjamulticonfig',
          'csv1-linux-ubuntu24.04-x64-generic-clang-default-ninjamulticonfig',
          'csv1-linux-ubuntu24.04-arm64-generic-gcc-default-ninja',
          'csv1-linux-ubuntu24.04-arm64-generic-clang-default-ninja',
          'csv1-windows-v10-x64-generic-msvc-default-msvc2022',
          'csv1-windows-v10-x64-generic-msvc-default-msvc2026',
          'csv1-windows-v10-x64-generic-msvcclang-default-msvc2022',
          'csv1-windows-v10-x64-generic-msvcclang-default-msvc2026',
        ]

        collected_version_entries: list[ManifestVersionsEntry] = []

        for name,f in zip(input_names_list,input_files_list):
          packages = load_version_file(f)
          collected_version_entries.append(
            ManifestVersionsEntry(name, packages)
          )

        release_manifest = Manifest(
          manifest_version=Manifest.MANIFEST_VERSION,
          project_name='3rdPartyBaseLibs',
          project_version='0.1.0',
          variants=collected_version_entries,
        )
        output_filename = Path('3rdPartyBaseLibs-0.1.0.csOrchestratorManifest')
        release_manifest.write_release_manifest(output_filename)
      shell: python
      working-directory: artifacts
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: manifest.csOrchestratorManifest
        path: |-
          artifacts/**/*.csOrchestratorManifest
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |-
          artifacts/**/*.tar.gz
          artifacts/**/*.csOrchestratorManifest
      if: ${{ github.ref_type == 'tag' }}
  orchestrator-matrix:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - execution_id: '0'
          os: linux
          os_version: ubuntu22.04
          architecture: x64
          architecture_variant: generic
          compiler: gcc
          compiler_version: default
          generator: ninjamulticonfig
          generator_type: multiconfig
          generator_cmake: Ninja Multi-Config
          runner: ubuntu-22.04
          c_compiler: gcc
          cpp_compiler: g++
        - execution_id: '1'
          os: linux
          os_version: ubuntu22.04
          architecture: x64
          architecture_variant: generic
          compiler: clang
          compiler_version: default
          generator: ninjamulticonfig
          generator_type: multiconfig
          generator_cmake: Ninja Multi-Config
          runner: ubuntu-22.04
          c_compiler: clang
          cpp_compiler: clang++
        - execution_id: '2'
          os: linux
          os_version: ubuntu22.04
          architecture: arm64
          architecture_variant: generic
          compiler: gcc
          compiler_version: default
          generator: ninja
          generator_type: singleconfig
          generator_cmake: Ninja
          runner: ubuntu-22.04-arm
          c_compiler: gcc
          cpp_compiler: g++
        - execution_id: '3'
          os: linux
          os_version: ubuntu22.04
          architecture: arm64
          architecture_variant: generic
          compiler: clang
          compiler_version: default
          generator: ninja
          generator_type: singleconfig
          generator_cmake: Ninja
          runner: ubuntu-22.04-arm
          c_compiler: clang
          cpp_compiler: clang++
        - execution_id: '4'
          os: linux
          os_version: ubuntu24.04
          architecture: x64
          architecture_variant: generic
          compiler: gcc
          compiler_version: default
          generator: ninjamulticonfig
          generator_type: multiconfig
          generator_cmake: Ninja Multi-Config
          runner: ubuntu-24.04
          c_compiler: gcc
          cpp_compiler: g++
        - execution_id: '5'
          os: linux
          os_version: ubuntu24.04
          architecture: x64
          architecture_variant: generic
          compiler: clang
          compiler_version: default
          generator: ninjamulticonfig
          generator_type: multiconfig
          generator_cmake: Ninja Multi-Config
          runner: ubuntu-24.04
          c_compiler: clang
          cpp_compiler: clang++
        - execution_id: '6'
          os: linux
          os_version: ubuntu24.04
          architecture: arm64
          architecture_variant: generic
          compiler: gcc
          compiler_version: default
          generator: ninja
          generator_type: singleconfig
          generator_cmake: Ninja
          runner: ubuntu-24.04-arm
          c_compiler: gcc
          cpp_compiler: g++
        - execution_id: '7'
          os: linux
          os_version: ubuntu24.04
          architecture: arm64
          architecture_variant: generic
          compiler: clang
          compiler_version: default
          generator: ninja
          generator_type: singleconfig
          generator_cmake: Ninja
          runner: ubuntu-24.04-arm
          c_compiler: clang
          cpp_compiler: clang++
        - execution_id: '8'
          os: windows
          os_version: v10
          architecture: x64
          architecture_variant: generic
          compiler: msvc
          compiler_version: default
          generator: msvc2022
          generator_type: multiconfig
          generator_cmake: Visual Studio 17 2022
          runner: windows-2022
        - execution_id: '9'
          os: windows
          os_version: v10
          architecture: x64
          architecture_variant: generic
          compiler: msvc
          compiler_version: default
          generator: msvc2026
          generator_type: multiconfig
          generator_cmake: Visual Studio 18 2026
          runner: windows-2025-vs2026
        - execution_id: '10'
          os: windows
          os_version: v10
          architecture: x64
          architecture_variant: generic
          compiler: msvcclang
          compiler_version: default
          generator: msvc2022
          generator_type: multiconfig
          generator_cmake: Visual Studio 17 2022
          runner: windows-2022
          toolset: ClangCL
        - execution_id: '11'
          os: windows
          os_version: v10
          architecture: x64
          architecture_variant: generic
          compiler: msvcclang
          compiler_version: default
          generator: msvc2026
          generator_type: multiconfig
          generator_cmake: Visual Studio 18 2026
          runner: windows-2025-vs2026
          toolset: ClangCL
    steps:
    - name: 3rdPartyBaseLibs git self-checkout
      uses: actions/checkout@v6
    - name: csCMake Git clone/pull-ff
      uses: actions/checkout@v6
      with:
        repository: cscosine/csCMake.git
        path: workspace/csCMake
        ref: dev
        fetch-depth: '1'
        token: ${{ secrets.ACTIONS_ORG_ACCESS }}
    - name: eigen3 Git clone/pull-ff
      uses: actions/checkout@v6
      with:
        repository: cscosine/eigen3.git
        path: workspace/eigen3
        ref: dev
        fetch-depth: '1'
        token: ${{ secrets.ACTIONS_ORG_ACCESS }}
    - name: tclap Git clone/pull-ff
      uses: actions/checkout@v6
      with:
        repository: cscosine/tclap.git
        path: workspace/tclap
        ref: dev
        fetch-depth: '1'
        token: ${{ secrets.ACTIONS_ORG_ACCESS }}
    - name: cmake workflow on eigen3 CMake Workflow for config(s) release
      run: |-
        set -e
        if [[ "${{ matrix.generator_type }}" == "singleconfig" ]]; then
          cmake --workflow workflow-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}-release
        elif [[ "${{ matrix.generator_type }}" == "multiconfig" ]]; then
          cmake --workflow workflow-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}-release
        else
          echo "Unknown generator_type: ${{ matrix.generator_type }}"
          exit 1
        fi
      shell: bash
      working-directory: workspace/eigen3
    - name: cmake workflow on tclap CMake Workflow for config(s) release
      run: |-
        set -e
        if [[ "${{ matrix.generator_type }}" == "singleconfig" ]]; then
          cmake --workflow workflow-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}-release
        elif [[ "${{ matrix.generator_type }}" == "multiconfig" ]]; then
          cmake --workflow workflow-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}-release
        else
          echo "Unknown generator_type: ${{ matrix.generator_type }}"
          exit 1
        fi
      shell: bash
      working-directory: workspace/tclap
    - name: Get Versions
      run: |-
        import sys
        from pathlib import Path
        from typing import cast

        from csorchestrator.portable.package_version import CMakeConfigPackageVersionGrep, PackageVersion
        from csorchestrator.portable.release_manifest import get_package_versions_and_write_single_variant_manifest

        repos_config_file_list = []
        repos_auto_search_list = ['eigen3', 'tclap']
        repos_version = []
        base_install_dir = Path('workspace/install')
        install_subdir = Path('csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}')
        variant_string = 'csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}'
        project_name = '3rdPartyBaseLibs'
        project_version = '0.1.0'
        output_file = Path('workspace/install/3rdPartyBaseLibs-0.1.0-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}.csOrchestratorManifest')

        errors_list = get_package_versions_and_write_single_variant_manifest(
            repos_config_file_list=repos_config_file_list,
            repos_auto_search_list=repos_auto_search_list,
            repos_version=repos_version,
            base_install_dir=base_install_dir,
            install_subdir=install_subdir,
            variant_string=variant_string,
            project_name=project_name,
            project_version=project_version,
            output_file=output_file,
        )

        if len(errors_list) > 0:
            for e in errors_list:
                print(e)
            sys.exit("ERROR: getting package versions")
      shell: python
      env:
        PYTHONPATH: ${{ github.workspace }}
    - name: Create Archives
      run: |-
        import json
        import os
        import sys
        import tarfile
        from dataclasses import dataclass
        from pathlib import Path

        @dataclass(frozen=True)
        class PackageVersion:
            name: str
            version: str

            def to_dict(self) -> dict[str, str]:
                return asdict(self)

            @classmethod
            def from_dict(cls, data: dict[str, str]) -> "PackageVersion":
                return cls(**data)


        packages = load_version_file('workspace/install/3rdPartyBaseLibs-0.1.0-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}.csOrchestratorManifest')

        if packages is None:
            sys.exit('packages was not loaded')

        for item in packages:
            install_subdir = Path('workspace/install/csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}').resolve()
            source_path = Path(install_subdir / Path(item.name)).resolve()
            output_path = Path(install_subdir / Path('csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}' + '-' + item.name + '-' + item.version + '.tar.gz')).resolve()

            with tarfile.open(output_path, 'w:gz') as tar:
                for path in source_path.rglob('*'):
                    resolved_path = path.resolve()
                    arcname = path.resolve().relative_to(install_subdir)
                    tar.add(resolved_path, arcname=arcname)
      shell: python
    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: 3rdPartyBaseLibs-0.1.0-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}
        path: |-
          workspace/install/csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}/*.tar.gz
          workspace/install/*.csOrchestratorManifest
