name: 3rdPartyBaseLibs
'on':
  push:
    branches:
    - main
    - dev
    tags:
    - v*.*.*
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
  schedule:
  - cron: 0 3 * * 1
jobs:
  release-from-artifacts:
    needs: orchestrator-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Repo Self Checkout
      uses: actions/checkout@v6
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
    - name: Show downloaded files
      run: find artifacts -type f
    - name: Manifest creation
      run: |-
        import sys
        from pathlib import Path
        from typing import cast

        from csorchestrator.sdk.portable.release_manifest import (
            collect_release_manifest_single_variant_and_prepare_manifest,
        )

        input_manifest_path_variant = [(Path('3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-x64-generic-gcc-default-ninjamulticonfig/3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-x64-generic-gcc-default-ninjamulticonfig.csOrchestratorManifest'), 'csv1-linux-ubuntu22.04-x64-generic-gcc-default-ninjamulticonfig'), (Path('3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-x64-generic-clang-default-ninjamulticonfig/3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-x64-generic-clang-default-ninjamulticonfig.csOrchestratorManifest'), 'csv1-linux-ubuntu22.04-x64-generic-clang-default-ninjamulticonfig'), (Path('3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-gcc-default-ninja/3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-gcc-default-ninja.csOrchestratorManifest'), 'csv1-linux-ubuntu22.04-arm64-generic-gcc-default-ninja'), (Path('3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-clang-default-ninja/3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-clang-default-ninja.csOrchestratorManifest'), 'csv1-linux-ubuntu22.04-arm64-generic-clang-default-ninja'), (Path('3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-x64-generic-gcc-default-ninjamulticonfig/3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-x64-generic-gcc-default-ninjamulticonfig.csOrchestratorManifest'), 'csv1-linux-ubuntu24.04-x64-generic-gcc-default-ninjamulticonfig'), (Path('3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-x64-generic-clang-default-ninjamulticonfig/3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-x64-generic-clang-default-ninjamulticonfig.csOrchestratorManifest'), 'csv1-linux-ubuntu24.04-x64-generic-clang-default-ninjamulticonfig'), (Path('3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-gcc-default-ninja/3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-gcc-default-ninja.csOrchestratorManifest'), 'csv1-linux-ubuntu24.04-arm64-generic-gcc-default-ninja'), (Path('3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-clang-default-ninja/3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-clang-default-ninja.csOrchestratorManifest'), 'csv1-linux-ubuntu24.04-arm64-generic-clang-default-ninja'), (Path('3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2022/3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2022.csOrchestratorManifest'), 'csv1-windows-v10-x64-generic-msvc-default-msvc2022'), (Path('3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2026/3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2026.csOrchestratorManifest'), 'csv1-windows-v10-x64-generic-msvc-default-msvc2026'), (Path('3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2022/3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2022.csOrchestratorManifest'), 'csv1-windows-v10-x64-generic-msvcclang-default-msvc2022'), (Path('3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2026/3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2026.csOrchestratorManifest'), 'csv1-windows-v10-x64-generic-msvcclang-default-msvc2026')]
        output_filepath = Path('3rdPartyBaseLibs-0.1.0.csOrchestratorManifest')
        project_name = '3rdPartyBaseLibs'
        project_version = "__PROJECT_VERSION__"

        errors_list = collect_release_manifest_single_variant_and_prepare_manifest(
            input_manifest_path_variant=input_manifest_path_variant,
            output_filepath=output_filepath,
            project_name=project_name,
            project_version=project_version,
        )

        if len(errors_list) > 0:
            for e in errors_list:
                print(e)
            sys.exit("ERROR: getting package versions")
      shell: python
      env:
        PYTHONPATH: ${{ github.workspace }}
      working-directory: artifacts
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: manifest.csOrchestratorManifest
        path: |-
          artifacts/**/*.csOrchestratorManifest
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |-
          artifacts/**/*.tar.gz
          artifacts/**/*.csOrchestratorManifest
      if: ${{ github.ref_type == 'tag' }}
  orchestrator-matrix:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - execution_id: '0'
          os: linux
          os_version: ubuntu22.04
          architecture: x64
          architecture_variant: generic
          compiler: gcc
          compiler_version: default
          generator: ninjamulticonfig
          generator_type: multiconfig
          generator_cmake: Ninja Multi-Config
          runner: ubuntu-22.04
          c_compiler: gcc
          cpp_compiler: g++
        - execution_id: '1'
          os: linux
          os_version: ubuntu22.04
          architecture: x64
          architecture_variant: generic
          compiler: clang
          compiler_version: default
          generator: ninjamulticonfig
          generator_type: multiconfig
          generator_cmake: Ninja Multi-Config
          runner: ubuntu-22.04
          c_compiler: clang
          cpp_compiler: clang++
        - execution_id: '2'
          os: linux
          os_version: ubuntu22.04
          architecture: arm64
          architecture_variant: generic
          compiler: gcc
          compiler_version: default
          generator: ninja
          generator_type: singleconfig
          generator_cmake: Ninja
          runner: ubuntu-22.04-arm
          c_compiler: gcc
          cpp_compiler: g++
        - execution_id: '3'
          os: linux
          os_version: ubuntu22.04
          architecture: arm64
          architecture_variant: generic
          compiler: clang
          compiler_version: default
          generator: ninja
          generator_type: singleconfig
          generator_cmake: Ninja
          runner: ubuntu-22.04-arm
          c_compiler: clang
          cpp_compiler: clang++
        - execution_id: '4'
          os: linux
          os_version: ubuntu24.04
          architecture: x64
          architecture_variant: generic
          compiler: gcc
          compiler_version: default
          generator: ninjamulticonfig
          generator_type: multiconfig
          generator_cmake: Ninja Multi-Config
          runner: ubuntu-24.04
          c_compiler: gcc
          cpp_compiler: g++
        - execution_id: '5'
          os: linux
          os_version: ubuntu24.04
          architecture: x64
          architecture_variant: generic
          compiler: clang
          compiler_version: default
          generator: ninjamulticonfig
          generator_type: multiconfig
          generator_cmake: Ninja Multi-Config
          runner: ubuntu-24.04
          c_compiler: clang
          cpp_compiler: clang++
        - execution_id: '6'
          os: linux
          os_version: ubuntu24.04
          architecture: arm64
          architecture_variant: generic
          compiler: gcc
          compiler_version: default
          generator: ninja
          generator_type: singleconfig
          generator_cmake: Ninja
          runner: ubuntu-24.04-arm
          c_compiler: gcc
          cpp_compiler: g++
        - execution_id: '7'
          os: linux
          os_version: ubuntu24.04
          architecture: arm64
          architecture_variant: generic
          compiler: clang
          compiler_version: default
          generator: ninja
          generator_type: singleconfig
          generator_cmake: Ninja
          runner: ubuntu-24.04-arm
          c_compiler: clang
          cpp_compiler: clang++
        - execution_id: '8'
          os: windows
          os_version: v10
          architecture: x64
          architecture_variant: generic
          compiler: msvc
          compiler_version: default
          generator: msvc2022
          generator_type: multiconfig
          generator_cmake: Visual Studio 17 2022
          runner: windows-2022
        - execution_id: '9'
          os: windows
          os_version: v10
          architecture: x64
          architecture_variant: generic
          compiler: msvc
          compiler_version: default
          generator: msvc2026
          generator_type: multiconfig
          generator_cmake: Visual Studio 18 2026
          runner: windows-2025-vs2026
        - execution_id: '10'
          os: windows
          os_version: v10
          architecture: x64
          architecture_variant: generic
          compiler: msvcclang
          compiler_version: default
          generator: msvc2022
          generator_type: multiconfig
          generator_cmake: Visual Studio 17 2022
          runner: windows-2022
          toolset: ClangCL
        - execution_id: '11'
          os: windows
          os_version: v10
          architecture: x64
          architecture_variant: generic
          compiler: msvcclang
          compiler_version: default
          generator: msvc2026
          generator_type: multiconfig
          generator_cmake: Visual Studio 18 2026
          runner: windows-2025-vs2026
          toolset: ClangCL
    steps:
    - name: 3rdPartyBaseLibs git self-checkout
      uses: actions/checkout@v6
    - name: csCMake Git clone/pull-ff
      uses: actions/checkout@v6
      with:
        repository: cscosine/csCMake.git
        path: workspace/csCMake
        ref: dev
        fetch-depth: '1'
        token: ${{ secrets.ACTIONS_ORG_ACCESS }}
    - name: eigen3 Git clone/pull-ff
      uses: actions/checkout@v6
      with:
        repository: cscosine/eigen3.git
        path: workspace/eigen3
        ref: dev
        fetch-depth: '1'
        token: ${{ secrets.ACTIONS_ORG_ACCESS }}
    - name: cmake workflow on eigen3 CMake Workflow for config(s) release
      run: |-
        set -e
        if [[ "${{ matrix.generator_type }}" == "singleconfig" ]]; then
          cmake --workflow workflow-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}-release
        elif [[ "${{ matrix.generator_type }}" == "multiconfig" ]]; then
          cmake --workflow workflow-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}-release
        else
          echo "Unknown generator_type: ${{ matrix.generator_type }}"
          exit 1
        fi
      shell: bash
      working-directory: workspace/eigen3
    - name: Get Versions
      run: |-
        import sys
        from pathlib import Path
        from typing import cast

        from csorchestrator.sdk.portable.package_version import CMakeConfigPackageVersionGrep, PackageVersion
        from csorchestrator.sdk.portable.release_manifest import get_package_versions_and_write_single_variant_manifest

        repos_config_file_list = []
        repos_auto_search_list = ['eigen3']
        repos_version = []
        base_install_dir = Path('workspace/install')
        install_subdir = Path('csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}')
        variant_string = 'csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}'
        project_name = '3rdPartyBaseLibs'
        project_version = '0.1.0'
        output_file = Path('workspace/install/3rdPartyBaseLibs-0.1.0-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}.csOrchestratorManifest')

        errors_list = get_package_versions_and_write_single_variant_manifest(
            repos_config_file_list=repos_config_file_list,
            repos_auto_search_list=repos_auto_search_list,
            repos_version=repos_version,
            base_install_dir=base_install_dir,
            install_subdir=install_subdir,
            variant_string=variant_string,
            project_name=project_name,
            project_version=project_version,
            output_file=output_file,
        )

        if len(errors_list) > 0:
            for e in errors_list:
                print(e)
            sys.exit("ERROR: getting package versions")
      shell: python
      env:
        PYTHONPATH: ${{ github.workspace }}
    - name: Create Archives
      run: |-
        import sys
        from pathlib import Path
        from typing import cast

        from csorchestrator.sdk.portable.release_manifest import (
            load_release_manifest_single_variant_and_prepare_archive,
        )

        input_full_path = Path('workspace/install/3rdPartyBaseLibs-0.1.0-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}.csOrchestratorManifest')
        context_os_architecture_compiler_generator_string = 'csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}'
        input_base_dir = Path('workspace/install')

        errors_list = load_release_manifest_single_variant_and_prepare_archive(
            input_full_path=input_full_path,
            context_os_architecture_compiler_generator_string=context_os_architecture_compiler_generator_string,
            input_base_dir=input_base_dir.resolve(),
        )

        if len(errors_list) > 0:
            for e in errors_list:
                print(e)
            sys.exit("ERROR: getting package versions")
      shell: python
      env:
        PYTHONPATH: ${{ github.workspace }}
    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: 3rdPartyBaseLibs-0.1.0-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}
        path: |-
          workspace/install/*.tar.gz
          workspace/install/*.csOrchestratorManifest
