name: 3rdPartyBaseLibs
'on':
  push:
    branches:
    - main
    - dev
    tags:
    - v*.*.*
  pull_request:
    branches:
    - main
  workflow_dispatch: {}
  schedule:
  - cron: 0 3 * * 1
jobs:
  release-from-artifacts:
    needs: orchestrator-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts
    - name: Show downloaded files
      run: find artifacts -type f
    - name: Manifest creation
      run: |
        from dataclasses import dataclass, field, asdict
        from typing import Any, ClassVar
        from pathlib import Path
        import json

        @dataclass(frozen=True)
        class CMakeConfigPackageVersion:
            name: str
            version: str

            def to_dict(self) -> dict[str, str]:
                return asdict(self)

            @classmethod
            def from_dict(cls, data: dict[str, str]) -> "CMakeConfigPackageVersion":
                return cls(**data)

        @dataclass
        class ManifestVersionsEntry:
            variant: str
            entries: list[CMakeConfigPackageVersion] = field(default_factory=list)

            def to_dict(self) -> dict[str, Any]:
                return {
                    "variant": self.variant,
                    "entries": [entry.to_dict() for entry in self.entries],
                }

            @classmethod
            def from_dict(cls, data: dict[str, Any]) -> "ManifestVersionsEntry":
                return cls(
                    variant=data["variant"],
                    entries=[CMakeConfigPackageVersion.from_dict(entry) for entry in data["entries"]],
                )

        @dataclass
        class Manifest:
            manifest_version: str
            project_name: str
            project_version: str
            variants: list[ManifestVersionsEntry] = field(default_factory=list)

            MANIFEST_VERSION: ClassVar[str] = "1.0"

            def to_dict(self) -> dict[str, Any]:
                return {
                    "manifest_version": self.manifest_version,
                    "project_name": self.project_name,
                    "project_version": self.project_version,
                    "variants": [variant.to_dict() for variant in self.variants],
                }

            @classmethod
            def from_dict(cls, data: dict[str, Any]) -> "Manifest":
                return cls(
                    manifest_version=data["manifest_version"],
                    project_name=data["project_name"],
                    project_version=data["project_version"],
                    variants=[ManifestVersionsEntry.from_dict(variant) for variant in data["variants"]],
                )

        def write_release_manifest(
            manifest: Manifest,
            filename: Path,
        ) -> None:
            """Write a release manifest to a JSON file."""
            path = Path(filename)
            # TODO robustify and return possible errors
            with path.open("w", encoding="utf-8") as f:
                json.dump(manifest.to_dict(), f, indent=2, sort_keys=True)

        def load_version_file(src: Path) -> list[CMakeConfigPackageVersion]:
            packages = []
            with open(src, encoding="utf-8") as f:
                packages = json.load(f)

            # TODO make robust to errors
            ret = [CMakeConfigPackageVersion.from_dict(entry) for entry in packages]

            return ret

        input_files_list = [
          '3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-x64-generic-gcc-default-ninjamulticonfig/csv1-linux-ubuntu22.04-x64-generic-gcc-default-ninjamulticonfig.csOrchestratorVersion',
          '3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-x64-generic-clang-default-ninjamulticonfig/csv1-linux-ubuntu22.04-x64-generic-clang-default-ninjamulticonfig.csOrchestratorVersion',
          '3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-gcc-default-ninja/csv1-linux-ubuntu22.04-arm64-generic-gcc-default-ninja.csOrchestratorVersion',
          '3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu22.04-arm64-generic-clang-default-ninja/csv1-linux-ubuntu22.04-arm64-generic-clang-default-ninja.csOrchestratorVersion',
          '3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-x64-generic-gcc-default-ninjamulticonfig/csv1-linux-ubuntu24.04-x64-generic-gcc-default-ninjamulticonfig.csOrchestratorVersion',
          '3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-x64-generic-clang-default-ninjamulticonfig/csv1-linux-ubuntu24.04-x64-generic-clang-default-ninjamulticonfig.csOrchestratorVersion',
          '3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-gcc-default-ninja/csv1-linux-ubuntu24.04-arm64-generic-gcc-default-ninja.csOrchestratorVersion',
          '3rdPartyBaseLibs-0.1.0-csv1-linux-ubuntu24.04-arm64-generic-clang-default-ninja/csv1-linux-ubuntu24.04-arm64-generic-clang-default-ninja.csOrchestratorVersion',
          '3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2022/csv1-windows-v10-x64-generic-msvc-default-msvc2022.csOrchestratorVersion',
          '3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvc-default-msvc2026/csv1-windows-v10-x64-generic-msvc-default-msvc2026.csOrchestratorVersion',
          '3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2022/csv1-windows-v10-x64-generic-msvcclang-default-msvc2022.csOrchestratorVersion',
          '3rdPartyBaseLibs-0.1.0-csv1-windows-v10-x64-generic-msvcclang-default-msvc2026/csv1-windows-v10-x64-generic-msvcclang-default-msvc2026.csOrchestratorVersion',
        ]

        input_names_list = [
          'csv1-linux-ubuntu22.04-x64-generic-gcc-default-ninjamulticonfig',
          'csv1-linux-ubuntu22.04-x64-generic-clang-default-ninjamulticonfig',
          'csv1-linux-ubuntu22.04-arm64-generic-gcc-default-ninja',
          'csv1-linux-ubuntu22.04-arm64-generic-clang-default-ninja',
          'csv1-linux-ubuntu24.04-x64-generic-gcc-default-ninjamulticonfig',
          'csv1-linux-ubuntu24.04-x64-generic-clang-default-ninjamulticonfig',
          'csv1-linux-ubuntu24.04-arm64-generic-gcc-default-ninja',
          'csv1-linux-ubuntu24.04-arm64-generic-clang-default-ninja',
          'csv1-windows-v10-x64-generic-msvc-default-msvc2022',
          'csv1-windows-v10-x64-generic-msvc-default-msvc2026',
          'csv1-windows-v10-x64-generic-msvcclang-default-msvc2022',
          'csv1-windows-v10-x64-generic-msvcclang-default-msvc2026',
        ]

        collected_version_entries: list[ManifestVersionsEntry] = []

        for name,f in zip(input_names_list,input_files_list):
          packages = load_version_file(f)
          collected_version_entries.append(
            ManifestVersionsEntry(name, packages)
          )

        release_manifest = Manifest(
          manifest_version=Manifest.MANIFEST_VERSION,
          project_name='3rdPartyBaseLibs',
          project_version='0.1.0',
          variants=collected_version_entries,
        )
        output_filename = Path('3rdPartyBaseLibs-0.1.0.csOrchestratorManifest')
        write_release_manifest(release_manifest,output_filename)
      shell: python
      working-directory: artifacts
    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: manifest.csOrchestratorManifest
        path: |-
          artifacts/**/*.csOrchestratorManifest
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: |-
          artifacts/**/*.tar.gz
          artifacts/**/*.csOrchestratorManifest
      if: ${{ github.ref_type == 'tag' }}
  orchestrator-matrix:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - execution_id: '0'
          os: linux
          os_version: ubuntu22.04
          architecture: x64
          architecture_variant: generic
          compiler: gcc
          compiler_version: default
          generator: ninjamulticonfig
          generator_type: multiconfig
          generator_cmake: Ninja Multi-Config
          runner: ubuntu-22.04
          c_compiler: gcc
          cpp_compiler: g++
        - execution_id: '1'
          os: linux
          os_version: ubuntu22.04
          architecture: x64
          architecture_variant: generic
          compiler: clang
          compiler_version: default
          generator: ninjamulticonfig
          generator_type: multiconfig
          generator_cmake: Ninja Multi-Config
          runner: ubuntu-22.04
          c_compiler: clang
          cpp_compiler: clang++
        - execution_id: '2'
          os: linux
          os_version: ubuntu22.04
          architecture: arm64
          architecture_variant: generic
          compiler: gcc
          compiler_version: default
          generator: ninja
          generator_type: singleconfig
          generator_cmake: Ninja
          runner: ubuntu-22.04-arm
          c_compiler: gcc
          cpp_compiler: g++
        - execution_id: '3'
          os: linux
          os_version: ubuntu22.04
          architecture: arm64
          architecture_variant: generic
          compiler: clang
          compiler_version: default
          generator: ninja
          generator_type: singleconfig
          generator_cmake: Ninja
          runner: ubuntu-22.04-arm
          c_compiler: clang
          cpp_compiler: clang++
        - execution_id: '4'
          os: linux
          os_version: ubuntu24.04
          architecture: x64
          architecture_variant: generic
          compiler: gcc
          compiler_version: default
          generator: ninjamulticonfig
          generator_type: multiconfig
          generator_cmake: Ninja Multi-Config
          runner: ubuntu-24.04
          c_compiler: gcc
          cpp_compiler: g++
        - execution_id: '5'
          os: linux
          os_version: ubuntu24.04
          architecture: x64
          architecture_variant: generic
          compiler: clang
          compiler_version: default
          generator: ninjamulticonfig
          generator_type: multiconfig
          generator_cmake: Ninja Multi-Config
          runner: ubuntu-24.04
          c_compiler: clang
          cpp_compiler: clang++
        - execution_id: '6'
          os: linux
          os_version: ubuntu24.04
          architecture: arm64
          architecture_variant: generic
          compiler: gcc
          compiler_version: default
          generator: ninja
          generator_type: singleconfig
          generator_cmake: Ninja
          runner: ubuntu-24.04-arm
          c_compiler: gcc
          cpp_compiler: g++
        - execution_id: '7'
          os: linux
          os_version: ubuntu24.04
          architecture: arm64
          architecture_variant: generic
          compiler: clang
          compiler_version: default
          generator: ninja
          generator_type: singleconfig
          generator_cmake: Ninja
          runner: ubuntu-24.04-arm
          c_compiler: clang
          cpp_compiler: clang++
        - execution_id: '8'
          os: windows
          os_version: v10
          architecture: x64
          architecture_variant: generic
          compiler: msvc
          compiler_version: default
          generator: msvc2022
          generator_type: multiconfig
          generator_cmake: Visual Studio 17 2022
          runner: windows-2022
        - execution_id: '9'
          os: windows
          os_version: v10
          architecture: x64
          architecture_variant: generic
          compiler: msvc
          compiler_version: default
          generator: msvc2026
          generator_type: multiconfig
          generator_cmake: Visual Studio 18 2026
          runner: windows-2025-vs2026
        - execution_id: '10'
          os: windows
          os_version: v10
          architecture: x64
          architecture_variant: generic
          compiler: msvcclang
          compiler_version: default
          generator: msvc2022
          generator_type: multiconfig
          generator_cmake: Visual Studio 17 2022
          runner: windows-2022
          toolset: ClangCL
        - execution_id: '11'
          os: windows
          os_version: v10
          architecture: x64
          architecture_variant: generic
          compiler: msvcclang
          compiler_version: default
          generator: msvc2026
          generator_type: multiconfig
          generator_cmake: Visual Studio 18 2026
          runner: windows-2025-vs2026
          toolset: ClangCL
    steps:
    - name: csCMake Git clone/pull-ff
      uses: actions/checkout@v6
      with:
        repository: cscosine/csCMake.git
        path: workspace/csCMake
        ref: dev
        fetch-depth: '1'
        token: ${{ secrets.ACTIONS_ORG_ACCESS }}
    - name: eigen3 Git clone/pull-ff
      uses: actions/checkout@v6
      with:
        repository: cscosine/eigen3.git
        path: workspace/eigen3
        ref: dev
        fetch-depth: '1'
        token: ${{ secrets.ACTIONS_ORG_ACCESS }}
    - name: cmake workflow on eigen3 CMake Workflow for config(s) release
      run: |-
        set -e
        if [[ "${{ matrix.generator_type }}" == "singleconfig" ]]; then
          cmake --workflow workflow-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}-release
        elif [[ "${{ matrix.generator_type }}" == "multiconfig" ]]; then
          cmake --workflow workflow-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}-release
        else
          echo "Unknown generator_type: ${{ matrix.generator_type }}"
          exit 1
        fi
      shell: bash
      working-directory: workspace/eigen3
    - name: Get Versions
      run: |
        from pathlib import Path
        import re
        import json
        import sys
        import os
        from dataclasses import dataclass, field, asdict
        from typing import Any, ClassVar

        @dataclass(frozen=True)
        class CMakeConfigPackageVersionGrep:
            name: str
            version_file: Path

        @dataclass(frozen=True)
        class CMakeConfigPackageVersion:
            name: str
            version: str

            def to_dict(self) -> dict[str, str]:
                return asdict(self)

            @classmethod
            def from_dict(cls, data: dict[str, str]) -> "CMakeConfigPackageVersion":
                return cls(**data)

        @dataclass
        class VersionSearchOutput:
            versions: list[CMakeConfigPackageVersion] = field(default_factory=list)
            errors: list[str] = field(default_factory=list)

        def grep_package_version(filename: Path) -> tuple[str | None, str | None]:
            path = filename

            if not path.is_file():
                return (None, f"ERROR: file not found: {path}")

            content = path.read_text(encoding="utf-8")

            matches = []

            for m in re.finditer(
                r'set\s*\(\s*PACKAGE_VERSION\s+("([^"]*)"|([^\s\)]+))\s*\)',
                content,
            ):
                value = m.group(2) or m.group(3)

                # Ignore computed values like "${PACKAGE_VERSION} (...)"
                if "${" in value:
                    continue

                matches.append(value)

            if len(matches) != 1:
                return (None, f"ERROR: {path}: expected exactly one PACKAGE_VERSION definition, found {len(matches)}")

            version = matches[0]
            return (version, None)

        def find_cmake_config_version(search_path: Path, name: str) -> tuple[Path | None, str | None]:
            candidates = {
                f"{name}-config-version.cmake".lower(),
                f"{name}ConfigVersion.cmake".lower(),
            }

            matches = [p for p in search_path.rglob("*") if p.is_file() and p.name.lower() in candidates]

            if not matches:
                return (None, f"No config version file found for '{name}' under '{search_path}'")

            if len(matches) > 1:
                return (None, "Multiple config version files found:" + ", ".join(str(p) for p in matches))

            return (matches[0], None)

        def get_versions_helper(
            repos_config_file_list: list[CMakeConfigPackageVersionGrep],  # pairs of repo and files reporting versions
            repos_auto_search_list: list[str],  # repo name only
            repos_version: list[CMakeConfigPackageVersion],  # pairs of repo and versions
            base_install_dir: Path,
            install_subdir: Path,
            base_folder_path: Path | None,
        ) -> VersionSearchOutput:
            result = VersionSearchOutput()

            # fixed versions
            for repo_v in repos_version:
                result.versions.append(CMakeConfigPackageVersion(name=repo_v.name, version=repo_v.version))

            # repo with version with file hint
            for repo in repos_config_file_list:
                if base_folder_path is not None:
                    target_full_path = base_folder_path / base_install_dir / install_subdir / repo.version_file
                else:
                    target_full_path = base_install_dir / install_subdir / repo.version_file

                version_or_err = grep_package_version(target_full_path)

                if version_or_err[1] is not None:
                    result.errors.append(version_or_err[1])

                else:
                    assert version_or_err[0] is not None
                    version = version_or_err[0]
                    result.versions.append(CMakeConfigPackageVersion(name=repo.name, version=version))

            # repo with version autosearch
            for name in repos_auto_search_list:
                if base_folder_path is not None:
                    search_path = base_folder_path / base_install_dir / install_subdir / name
                else:
                    search_path = base_install_dir / install_subdir / name
                path_or_err = find_cmake_config_version(search_path=search_path, name=name)
                if path_or_err[1] is not None:
                    result.errors.append(path_or_err[1])

                else:
                    assert path_or_err[0] is not None
                    path = path_or_err[0]

                    version_or_err = grep_package_version(path)

                    if version_or_err[1] is not None:
                        result.errors.append(version_or_err[1])

                    else:
                        assert version_or_err[0] is not None
                        version = version_or_err[0]
                        result.versions.append(CMakeConfigPackageVersion(name=name, version=version))

            return result

        def write_version_file(dest: Path, src: list[CMakeConfigPackageVersion]) -> None:
            ret = [entry.to_dict() for entry in src]

            with open(dest, "w", encoding="utf-8") as f:
                json.dump(ret, f, indent=4, ensure_ascii=False)

        repos_config_file_list : list[CMakeConfigPackageVersionGrep] = []

        repos_auto_search_list : list[str] = [
            'eigen3',
        ]

        repos_version: list[CMakeConfigPackageVersion] = []

        result = get_versions_helper(
            repos_config_file_list,
            repos_auto_search_list,
            repos_version,
            Path('workspace/install'),
            Path('csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}'),
            None
        )
        if len(result.errors) > 0:
            for e in result.errors:
                print(e)
            sys.exit('ERROR: getting package versions')

        output_file = (
            Path('workspace/install')
            / Path('csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}.csOrchestratorVersion')
        )

        write_version_file(output_file, result.versions)
      shell: python
    - name: Create Archives
      run: |-
        import json
        import os
        import sys
        import tarfile
        from dataclasses import dataclass
        from pathlib import Path

        @dataclass(frozen=True)
        class CMakeConfigPackageVersion:
            name: str
            version: str

            def to_dict(self) -> dict[str, str]:
                return asdict(self)

            @classmethod
            def from_dict(cls, data: dict[str, str]) -> "CMakeConfigPackageVersion":
                return cls(**data)

        def load_version_file(src: Path) -> list[CMakeConfigPackageVersion]:
            packages = []
            with open(src, encoding="utf-8") as f:
                packages = json.load(f)

            # TODO make robust to errors
            ret = [CMakeConfigPackageVersion.from_dict(entry) for entry in packages]

            return ret


        packages = load_version_file('workspace/install/csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}.csOrchestratorVersion')

        if packages is None:
            sys.exit('packages was not loaded')

        for item in packages:
            install_subdir = Path('workspace/install/csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}').resolve()
            source_path = Path(install_subdir / Path(item.name)).resolve()
            output_path = Path(install_subdir / Path('csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}' + '-' + item.name + '-' + item.version + '.tar.gz')).resolve()

            with tarfile.open(output_path, 'w:gz') as tar:
                for path in source_path.rglob('*'):
                    resolved_path = path.resolve()
                    arcname = path.resolve().relative_to(install_subdir)
                    tar.add(resolved_path, arcname=arcname)
      shell: python
    - name: Upload Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: 3rdPartyBaseLibs-0.1.0-csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}
        path: |-
          workspace/install/csv1-${{ matrix.os }}-${{ matrix.os_version }}-${{ matrix.architecture }}-${{ matrix.architecture_variant }}-${{ matrix.compiler }}-${{ matrix.compiler_version }}-${{ matrix.generator }}/*.tar.gz
          workspace/install/*.csOrchestratorVersion
